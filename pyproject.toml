[project]
name = "mmpose"
version = "1.3.2"
description = "OpenMMLab Pose Estimation Toolbox - Extended with COCO29 support"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<3.13"
dependencies = [
    # Core ML
    "torch>=2.0.0",
    "torchvision",

    # OpenMMLab ecosystem (mmcv installed separately — needs --no-build-isolation)
    "mmengine>=0.6.0,<1.0.0",
    "mmdet>=3.0.0,<3.3.0",

    # numpy pinned below 2.0 to avoid ABI issues with xtcocotools
    "numpy>=1.22,<2.0",

    # Runtime deps
    "xtcocotools>=1.13",
    "matplotlib",
    "munkres",
    "opencv-python",
    "pillow",
    "scipy",
    "json_tricks",
    "regex",
    "requests",
    "titlecase",

    # ONNX export & inference
    "onnx",
    "onnxruntime",

    # Training
    "albumentations>=1.0.0,<2.0.0",
    "tensorboard",

    # Misc
    "rich",
    "tqdm",
    "pyyaml",
    "tabulate",
    "yapf",
]

[project.optional-dependencies]
train = [
    "albumentations>=1.0.0,<2.0.0",
    "tensorboard",
]
test = [
    "pytest",
    "pytest-runner",
    "coverage",
    "flake8",
    "parameterized",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mmpose*"]
exclude = ["configs*", "tools*", "demo*", "docs*", "tests*"]

[tool.setuptools.package-data]
"mmpose.ops" = ["*/*.so"]

# ── uv configuration ─────────────────────────────────────────────
[dependency-groups]
dev = []

[tool.uv.sources]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources.torch]
index = "pytorch-cu128"

[tool.uv.sources.torchvision]
index = "pytorch-cu128"

[tool.uv.extra-build-dependencies]
xtcocotools = ["numpy", "cython"]
